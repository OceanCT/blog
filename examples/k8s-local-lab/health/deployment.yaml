apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-demo
  namespace: resource-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-demo
  template:
    metadata:
      labels:
        app: health-demo
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: worker
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: [python, -u, /lab/worker.py]
          resources:
            requests: {cpu: 50m, memory: 24Mi}
            limits: {cpu: 250m, memory: 64Mi}
          volumeMounts:
            - {name: code, mountPath: /lab, readOnly: true}
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            exec:
              command: [test, -f, /tmp/live]
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 3
      volumes:
        - name: code
          configMap: {name: health-code}
---
apiVersion: v1
kind: Service
metadata:
  name: health-demo
  namespace: resource-lab
spec:
  selector: {app: health-demo}
  ports:
    - {port: 80, targetPort: 80}
